<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AD — Probaclac Adultes 1:1</title>
<style>
  :root{
    --ink:#0a0a0a; --paper:#fafaf7; --accent:#ff5b04; --qcblue:#1999D4;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#000; }
  body{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }

  .ad{
    position:relative; width:1080px; height:1080px;
    overflow:hidden; background:var(--paper);
  }

  /* ── shared title metrics: identical in white & black scenes ── */
  .title{
    position:absolute; left:84px; right:84px; top:50%;
    transform: translateY(-58%);
    font-weight:700; letter-spacing:-.045em;
    font-size:108px; line-height:.97;
    color:var(--ink);
  }
  .title .w{ display:inline-block; overflow:hidden; padding-right:.14em; vertical-align:top; }
  .title .w > span{ display:inline-block; transform:translateY(112%); }

  /* brand logo in the top band, flush-left with the hairline */
  .adlogo{
    position:absolute; left:84px; top:104px;
    height:42px; width:auto; display:block;
    opacity:0;
  }

  .hairline{
    position:absolute; left:84px; right:84px; top:160px;
    height:2px; background:rgba(10,10,10,.12);
  }
  .hairline .fill{ display:block; height:100%; width:100%; background:var(--accent); transform:scaleX(0); transform-origin:left; }

  /* ── SCENE 2 : black ── */
  .scene-black{
    position:absolute; inset:0; background:var(--ink);
    clip-path: inset(100% 0 0 0);
  }
  .scene-black .title{ color:var(--paper); }
  .scene-black .hairline{ background:rgba(255,255,255,.16); }

  /* bottle pyramid — 3 transparent PNGs, bottoms perfectly aligned */
  .stage{
    position:absolute; left:0; right:0;
    top:210px; bottom:70px;
  }
  .b{
    position:absolute; left:50%; bottom:0;
  }
  .b img{
    display:block; width:auto;
    filter:
      drop-shadow(0 36px 64px rgba(0,0,0,.6))
      drop-shadow(0 12px 26px rgba(0,0,0,.42));
  }
  .b--front{ z-index:3; }
  .b--front img{ height:800px; }
  .b--left, .b--right{ z-index:1; }
  .b--left img, .b--right img{ height:600px; filter: brightness(.9) drop-shadow(0 30px 56px rgba(0,0,0,.65)); }

  /* section title in white */
  .fam{
    position:absolute; left:84px; right:84px; top:96px;
    text-align:center;
    font-weight:700; letter-spacing:-.045em;
    font-size:84px; line-height:1;
    color:var(--paper);
  }
  .fam .w{ display:inline-block; overflow:hidden; padding-right:.14em; vertical-align:top; }
  .fam .w > span{ display:inline-block; transform:translateY(112%); }

  /* ── SCENE 3 : blue QC ── */
  .scene-blue{
    position:absolute; inset:0; background:var(--qcblue);
    clip-path: inset(100% 0 0 0);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:54px;
  }
  .scene-blue .badge{
    width:340px; height:auto;
    transform:scale(0);
    filter: drop-shadow(0 30px 60px rgba(0,0,0,.25));
  }
  .scene-blue .tag{
    font-weight:700; letter-spacing:-.03em;
    font-size:64px; line-height:1.05;
    color:#fff; text-align:center;
    max-width:760px;
  }
  .scene-blue .tag .w{ display:inline-block; overflow:hidden; padding-right:.14em; vertical-align:top; }
  .scene-blue .tag .w > span{ display:inline-block; transform:translateY(112%); }
</style>
</head>
<body>

<div class="ad" id="ad">

  <!-- SCENE 1 : white -->
  <div class="scene-white">
    <img class="adlogo" id="eb1" src="assets/logo-noir.png" alt="Probaclac">
    <div class="hairline"><span class="fill" id="hl1"></span></div>
    <h1 class="title" id="t1">Le probiotique le plus complet et efficace.</h1>
  </div>

  <!-- SCENE 2 : black -->
  <div class="scene-black" id="sBlack">
    <img class="adlogo" id="eb2" src="assets/logo-blanc.png" alt="Probaclac" style="opacity:1;">
    <div class="hairline"><span class="fill" id="hl2" style="transform:scaleX(1);"></span></div>
    <h1 class="title" id="t2">Le probiotique le plus complet et efficace.</h1>

    <h2 class="fam" id="fam">Une famille complète.</h2>

    <div class="stage">
      <div class="b b--left"  id="bVoyage"><img src="assets/bottle-voyage-trim.png" alt=""></div>
      <div class="b b--right" id="b50"><img src="assets/bottle-50plus-trim.png" alt=""></div>
      <div class="b b--front" id="bAdultes"><img src="assets/bottle-adultes-trim.png" alt=""></div>
    </div>
  </div>

  <!-- SCENE 3 : blue -->
  <div class="scene-blue" id="sBlue">
    <img class="badge" id="badge" src="assets/faitqc.png" alt="Fabriqué au Québec">
    <div class="tag" id="tag">Un probiotique fièrement québécois.</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // word-split titles + blue tag + family line
  ['t1','t2','tag','fam'].forEach(id => {
    const el = document.getElementById(id);
    const words = el.textContent.trim().split(/\s+/);
    el.innerHTML = words.map(w => `<span class="w"><span>${w}</span></span>`).join(' ');
  });

  const tl = gsap.timeline({ paused:true, defaults:{ ease:'power4.out' } });

  /* ── 0.0–1.2s : title reveals black on white ── */
  tl.to('#t1 .w > span', { y:0, duration:.95, stagger:.07 }, 0.10)
    .to('#eb1', { opacity:1, duration:.5 }, 0.10)
    .to('#hl1', { scaleX:1, duration:1.1, ease:'power3.inOut' }, 0.25);

  /* ── 2.0–2.9s : black curtain wipes up, title flips to white ── */
  tl.to('#sBlack', { clipPath:'inset(0% 0 0 0)', duration:.95, ease:'power3.inOut' }, 2.0);
  // the black scene's title is pre-revealed so the wipe "flips" the color
  tl.set('#t2 .w > span', { y:0 }, 0);

  /* ── 3.6–4.5s : title exits upward to clear the stage ── */
  tl.to('#t2', { y:-60, opacity:0, duration:.85, ease:'power3.in' }, 3.7)
    .to(['#eb2', '#sBlack .hairline'], { opacity:0, duration:.4 }, 3.7);

  /* ── pyramid setup : all centered, below the frame ── */
  tl.set(['#bVoyage','#b50','#bAdultes'], { xPercent:-50, y:760 }, 0);

  /* ── 4.6s : Adultes (front) rises centered ── */
  tl.to('#bAdultes', { y:0, duration:1.2, ease:'expo.out' }, 4.6);

  /* ── 4.75s : the two others rise behind it (hidden, centered) ── */
  tl.to(['#bVoyage','#b50'], { y:0, duration:1.05, ease:'expo.out' }, 4.78);

  /* ── 5.25s : they fan out — ~15% tucked behind the orange ── */
  tl.to('#bVoyage', { x:-262, duration:1.05, ease:'power3.out' }, 5.25)
    .to('#b50',     { x: 262, duration:1.05, ease:'power3.out' }, 5.25);

  /* ── 5.9s : white section title arrives ── */
  tl.to('#fam .w > span', { y:0, duration:.85, stagger:.07 }, 5.9);

  /* ── 5.95–7.4s : gentle float of the whole trio ── */
  tl.to('.stage', { y:-16, duration:1.6, ease:'sine.inOut' }, 6.0);

  /* ── 7.6–8.4s : blue curtain + badge pop ── */
  tl.to('#sBlue', { clipPath:'inset(0% 0 0 0)', duration:.85, ease:'power3.inOut' }, 7.6)
    .to('#badge', { scale:1, duration:.9, ease:'back.out(1.6)' }, 8.05)
    .to('#tag .w > span', { y:0, duration:.8, stagger:.06 }, 8.35);

  /* ── 9.0–10s : subtle hold breath ── */
  tl.to('#badge', { scale:1.04, duration:1.0, ease:'sine.inOut' }, 9.0);

  /* lock total duration to exactly 10s */
  tl.to({}, { duration: 0.01 }, 9.99);

  window.AD_TL = tl;
  window.AD_READY = true;
</script>

</body>
</html>
