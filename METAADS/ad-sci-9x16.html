<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AD — Probaclac SCI 9:16</title>
<style>
  :root{
    --ink:#0a0a0a; --paper:#fafaf7; --accent:#ff5b04;
    --sci:#00B5D2; --qcblue:#1999D4;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:transparent; }
  body{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }

  /* bottom band (1313→1920, 607px) stays transparent → ffmpeg composites sci.mp4 there */
  .ad{ position:relative; width:1080px; height:1920px; overflow:hidden; background:transparent; }

  /* ── TOP : SCI cyan stat (0 → 1313) ── */
  .sci-top{
    position:absolute; left:0; top:0; width:1080px; height:1313px;
    background:var(--sci);
    clip-path: inset(0 0 0 0);
  }
  .adlogo{
    position:absolute; left:90px; top:120px;
    height:88px; width:auto; display:block;
    opacity:0;
  }
  .hairline{
    position:absolute; left:90px; right:90px; top:250px;
    height:3px; background:rgba(255,255,255,.32);
  }
  .hairline .fill{ display:block; height:100%; width:100%; background:#fff; transform:scaleX(0); transform-origin:left; }

  /* same sentence as the 1:1 — just larger, vertically centered in the cyan zone */
  .stat{
    position:absolute; left:90px; right:90px;
    top:770px; transform:translateY(-50%);
    font-weight:700; letter-spacing:-.04em;
    font-size:104px; line-height:1.0;
    color:#fff;
  }
  .stat .w{ display:inline-block; overflow:hidden; padding-right:.1em; vertical-align:top; }
  .stat .w > span{ display:inline-block; transform:translateY(112%); }

  .seam{
    position:absolute; left:0; top:1313px; width:1080px; height:7px;
    background:var(--sci); z-index:5;
  }

  /* ── END : blue QC (full screen) ── */
  .scene-blue{
    position:absolute; inset:0; background:var(--qcblue);
    clip-path: inset(100% 0 0 0);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:72px; z-index:10;
  }
  .scene-blue .badge{ width:440px; height:auto; transform:scale(0); filter:drop-shadow(0 30px 60px rgba(0,0,0,.25)); }
  .scene-blue .tag{
    font-weight:700; letter-spacing:-.03em; font-size:84px; line-height:1.05;
    color:#fff; text-align:center; max-width:820px;
  }
  .scene-blue .tag .w{ display:inline-block; overflow:hidden; padding-right:.14em; vertical-align:top; }
  .scene-blue .tag .w > span{ display:inline-block; transform:translateY(112%); }
</style>
</head>
<body>

<div class="ad" id="ad">

  <!-- bottom band transparent → sci.mp4 composited by ffmpeg -->

  <!-- top : SCI cyan stat -->
  <div class="sci-top" id="sciTop">
    <img class="adlogo" id="logo" src="assets/logo-blanc-trim.png" alt="Probaclac">
    <div class="hairline"><span class="fill" id="hl"></span></div>
    <h1 class="stat" id="stat">1 Canadien sur 5 souffre du syndrome du côlon irritable.</h1>
  </div>

  <div class="seam"></div>

  <!-- end : QC blue -->
  <div class="scene-blue" id="sBlue">
    <img class="badge" id="badge" src="assets/faitqc.png" alt="Fabriqué au Québec">
    <div class="tag" id="tag">Un probiotique fièrement québécois.</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  ['stat','tag'].forEach(id => {
    const el = document.getElementById(id);
    const words = el.textContent.trim().split(/\s+/);
    el.innerHTML = words.map(w => `<span class="w"><span>${w}</span></span>`).join(' ');
  });

  const tl = gsap.timeline({ paused:true, defaults:{ ease:'power4.out' } });

  /* ── 0.2–0.7s : logo + hairline ── */
  tl.to('#logo', { opacity:1, duration:.5 }, 0.20)
    .to('#hl', { scaleX:1, duration:1.0, ease:'power3.inOut' }, 0.30);

  /* ── 0.55–2.4s : stat reveals word by word ── */
  tl.to('#stat .w > span', { y:0, duration:.95, stagger:.055 }, 0.55);

  /* (video plays in the bottom band 0 → 6s) */

  /* ── 6.0–6.9s : QC blue wipes up + badge pop ── */
  tl.to('#sBlue', { clipPath:'inset(0% 0 0 0)', duration:.9, ease:'power3.inOut' }, 6.0)
    .to('#badge', { scale:1, duration:.95, ease:'back.out(1.6)' }, 6.5)
    .to('#tag .w > span', { y:0, duration:.85, stagger:.06 }, 6.85);

  /* ── 7.6–10s : subtle breath ── */
  tl.to('#badge', { scale:1.05, duration:1.4, ease:'sine.inOut' }, 7.6);

  tl.to({}, { duration:0.01 }, 9.99);

  window.AD_TL = tl;
  window.AD_READY = true;
</script>

</body>
</html>
